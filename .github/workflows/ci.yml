name: PyQt6 application checks

on:
  push:
    branches: [main]
    paths:
      - "sport_arm/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "sport_arm/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sport_arm/requirements.txt

      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Install dependencies
        working-directory: sport_arm
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        working-directory: sport_arm
        run: python -m py_compile main.py qt_main.py database.py

      - name: Run business-logic tests
        working-directory: sport_arm
        run: python -m unittest discover -s tests -v

      - name: Smoke-test clean startup, organizer and coach workflows
        working-directory: sport_arm
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PyQt6.QtWidgets import QApplication
          from qt_main import MainWindow

          qt = QApplication([])
          window = MainWindow(":memory:")

          # A fresh database must not contain any preconfigured users.
          assert not window.db.has_organizer()
          assert window.centralWidget().__class__.__name__ == "FirstRunPage"
          assert window.db.login("admin", "admin") is None
          assert window.db.login("coach", "coach") is None

          # Create an organizer with user-defined credentials.
          organizer_id = window.db.create_organizer(
              "admin_ci", "StrongPass1", "CI Organizer"
          )
          organizer = window.db.get_user(organizer_id)
          assert organizer is not None
          window.login_ok(organizer)

          # Add teams and players manually, then run both tournament systems.
          team_ids = []
          for team_index in range(4):
              team_id = window.db.create_team(
                  f"CI Team {team_index + 1}", "Magadan", f"Captain {team_index + 1}"
              )
              for player_index in range(6):
                  window.db.add_player(
                      team_id,
                      f"Player {team_index + 1}-{player_index + 1}",
                      player_index + 1,
                      "Outside hitter",
                      2000 + player_index,
                  )
              team_ids.append(team_id)

          for index, system in enumerate(("olympic", "round_robin"), start=1):
              tournament_id = window.db.create_tournament(
                  f"CI Tournament {index}", "Volleyball", system,
                  "01.06.2026", "30.06.2026", "Sports hall",
              )
              for team_id in team_ids:
                  application_id = window.db.submit_application(tournament_id, team_id)
                  window.db.set_application_status(application_id, "approved")
              window.db.generate_bracket(tournament_id)

          window.refresh_all()
          bracket = next(tab for name, tab in window.tabs if name == "Сетка")
          assert bracket.selector.combo.count() == 2
          bracket.selector.combo.setCurrentIndex(1)
          bracket.fill()

          # A coach can create a separate team account and access the coach pages.
          coach_id = window.db.register_coach(
              "coach_ci", "CoachPass2", "CI Coach", "Coach Team", "Magadan"
          )
          window.show_login()
          coach = window.db.get_user(coach_id)
          assert window.db.login("coach_ci", "CoachPass2") is not None
          window.login_ok(coach)

          expected_pages = {
              "Главная", "Моя команда", "Заявки на турниры", "Расписание",
              "Сетка", "Таблица", "Моя статистика", "Рейтинг"
          }
          assert set(window.pages) == expected_pages
          window.refresh_all()
          for page_name in expected_pages:
              window.goto(page_name)

          window.close()
          qt.quit()
          print("Clean-start PyQt and manual-entry smoke test passed.")
          PY
